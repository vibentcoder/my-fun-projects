<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RC Helicopter - Designed by Prakash Kumar</title>
  <style>
    :root{--sky1:#89d4ff;--sky2:#dff6ff;--ink:#102438;--panel:#152433;--panel2:#22384c;--accent:#55e6a5;--yellow:#ffd45b}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);background:#7acdec}
    body{touch-action:none;user-select:none}
    #game{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2) 74%,#8dcf77 74%,#4c9d57 100%)}
    #world{position:absolute;inset:0;overflow:hidden}
    .sun{position:absolute;right:8%;top:7%;width:94px;height:94px;border-radius:50%;background:#fff7a8;box-shadow:0 0 40px 15px rgba(255,245,145,.55)}
    .cloud{position:absolute;width:170px;height:56px;border-radius:60px;background:rgba(255,255,255,.82);filter:drop-shadow(0 9px 8px rgba(25,85,120,.08))}
    .cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}
    .cloud:before{width:75px;height:75px;left:24px;bottom:11px}.cloud:after{width:95px;height:95px;right:20px;bottom:5px}
    .c1{left:7%;top:12%;animation:drift 28s linear infinite}.c2{left:53%;top:26%;transform:scale(.65);animation:drift 36s linear infinite reverse}.c3{left:27%;top:42%;transform:scale(.45);animation:drift 42s linear infinite}
    @keyframes drift{50%{translate:55px 0}}
    .mountain{position:absolute;bottom:25%;width:0;height:0;border-left:180px solid transparent;border-right:180px solid transparent;border-bottom:230px solid #6f9eb0;opacity:.55}
    .m1{left:-80px}.m2{left:26%;transform:scale(.82)}.m3{right:-80px;transform:scale(1.1)}
    .city{position:absolute;left:0;right:0;bottom:24%;height:16%;display:flex;align-items:flex-end;gap:6px;opacity:.75}
    .building{flex:none;width:7%;min-width:45px;background:#547584;border-radius:4px 4px 0 0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);position:relative}
    .building:after{content:"";position:absolute;inset:10px 8px;background:repeating-linear-gradient(90deg,#ffe58c 0 5px,transparent 5px 13px),repeating-linear-gradient(0deg,transparent 0 12px,rgba(255,255,255,.22) 12px 16px);opacity:.65}
    #ground{position:absolute;left:0;right:0;bottom:0;height:26%;background:linear-gradient(#6dbd68,#387d45);border-top:5px solid #5b9d4d}
    .road{position:absolute;left:0;right:0;bottom:5%;height:42%;background:#4b555b;border-top:5px solid #e2e2d2;border-bottom:5px solid #e2e2d2}
    .road:after{content:"";position:absolute;left:0;right:0;top:50%;height:4px;background:repeating-linear-gradient(90deg,#ffe36a 0 45px,transparent 45px 80px)}
    .pad{position:absolute;bottom:16%;width:130px;height:28px;border-radius:50%;background:#3b454c;border:5px solid #f5f7ea;color:white;display:grid;place-items:center;font-weight:900;font-size:18px;box-shadow:0 10px 14px rgba(0,0,0,.28)}
    .pad:after{content:"H";position:absolute;top:-5px}.p1{left:7%}.p2{right:7%}
    .tower{position:absolute;width:50px;bottom:25%;background:linear-gradient(90deg,#b8c5ca,#e9eff1,#9eafb6);border:3px solid #6c7b82}
    .tower:before{content:"";position:absolute;left:-12px;right:-12px;top:-15px;height:15px;background:#e05858;border:3px solid #8d3939;border-radius:5px}.t1{left:42%;height:175px}.t2{left:69%;height:115px}
    .pole{position:absolute;left:84%;bottom:25%;height:205px;width:8px;background:#555}.pole:after{content:"";position:absolute;width:85px;height:30px;left:-38px;top:-4px;background:#333;border-radius:50%}

    #helicopter{position:absolute;width:145px;height:76px;transform-origin:50% 55%;will-change:transform,left,top;z-index:20}
    #helicopter.crashed{animation:blink .17s 5;filter:grayscale(.8)}
    @keyframes blink{50%{opacity:.25}}
    .heli-body{position:absolute;left:25px;top:25px;width:88px;height:41px;background:linear-gradient(135deg,#ff6d3b,#dc292f);border:3px solid #86242a;border-radius:50% 48% 33% 36%;box-shadow:inset -10px -8px 0 rgba(0,0,0,.12),0 7px 9px rgba(0,0,0,.23)}
    .window{position:absolute;left:32px;top:5px;width:38px;height:25px;background:linear-gradient(135deg,#d8f8ff,#418cae);border:3px solid #263e50;border-radius:55% 45% 12% 25%}
    .tail{position:absolute;left:102px;top:36px;width:42px;height:12px;background:#d83234;border:3px solid #86242a;border-left:0;transform:skewY(-8deg)}
    .tail-fin{position:absolute;right:-2px;top:17px;width:14px;height:30px;background:#e33d39;border:3px solid #86242a;clip-path:polygon(0 100%,0 45%,100% 0,100% 100%)}
    .tail-rotor{position:absolute;right:-8px;top:23px;width:23px;height:23px;border:3px solid #263e50;border-radius:50%;animation:spin .2s linear infinite}
    .tail-rotor:before,.tail-rotor:after{content:"";position:absolute;left:8px;top:-11px;width:3px;height:39px;background:#263e50}.tail-rotor:after{transform:rotate(90deg)}
    .mast{position:absolute;left:68px;top:12px;width:5px;height:18px;background:#263e50}
    .rotor{position:absolute;left:7px;top:6px;width:130px;height:7px;border-radius:50%;background:#263e50;transform-origin:center;animation:spin .12s linear infinite;box-shadow:0 0 4px rgba(0,0,0,.2)}
    @keyframes spin{to{transform:rotate(360deg)}}
    .skid{position:absolute;left:38px;top:65px;width:73px;height:12px;border:4px solid #263e50;border-top:0;border-radius:0 0 50% 50%}
    .skid:before,.skid:after{content:"";position:absolute;top:-12px;width:4px;height:12px;background:#263e50}.skid:before{left:13px}.skid:after{right:13px}

    #title{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:45;text-align:center;background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.1);border-radius:16px;padding:7px 16px;box-shadow:0 5px 14px rgba(0,0,0,.12);white-space:nowrap}
    #title strong{display:block;font-size:17px;letter-spacing:.5px}#title span{display:block;font-size:10px;color:#526b7b;margin-top:2px;font-weight:700}
    #hud{position:absolute;left:16px;top:78px;z-index:40;display:grid;grid-template-columns:repeat(3,minmax(85px,1fr));gap:8px;max-width:410px}
    .meter{background:rgba(8,25,40,.78);color:white;border:1px solid rgba(255,255,255,.18);padding:9px 12px;border-radius:12px;backdrop-filter:blur(8px);box-shadow:0 6px 16px rgba(0,0,0,.15)}
    .meter small{display:block;color:#a8c7d8;text-transform:uppercase;font-size:10px;letter-spacing:1.2px}.meter strong{font-size:18px}
    #mission{position:absolute;left:50%;top:72px;transform:translateX(-50%);z-index:40;background:rgba(255,255,255,.88);border:1px solid rgba(0,0,0,.1);border-radius:999px;padding:8px 16px;font-weight:750;box-shadow:0 5px 14px rgba(0,0,0,.12);text-align:center}
    #message{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%) scale(.92);z-index:60;padding:17px 25px;border-radius:16px;background:rgba(8,20,30,.91);color:white;font-weight:800;font-size:21px;opacity:0;pointer-events:none;transition:.2s;text-align:center;box-shadow:0 12px 34px rgba(0,0,0,.3)}
    #message.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
    #reset{position:absolute;right:16px;top:16px;z-index:50;border:0;border-radius:12px;padding:11px 15px;background:#fff;color:#183044;font-weight:800;cursor:pointer;box-shadow:0 5px 15px rgba(0,0,0,.18)}
    #remote{position:absolute;right:18px;bottom:18px;z-index:50;width:300px;padding:14px;border-radius:26px;background:linear-gradient(145deg,var(--panel2),var(--panel));color:white;box-shadow:0 16px 39px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.15);border:2px solid #314a5f}
    .remote-head{display:flex;align-items:center;justify-content:space-between;padding:1px 5px 10px}.remote-head strong{letter-spacing:.8px}.led{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 13px var(--accent)}
    .remote-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stick-box{background:#0e1a25;border-radius:18px;padding:9px;text-align:center;box-shadow:inset 0 4px 10px rgba(0,0,0,.5)}.stick-box small{color:#9db2c1;font-size:10px;text-transform:uppercase;letter-spacing:1px}
    .dpad{width:98px;height:98px;margin:6px auto 0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
    .ctrl{border:0;color:white;background:#344e63;font-size:21px;cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);touch-action:none}
    .ctrl:active,.ctrl.active{background:#55b88b;transform:translateY(1px)}
    .up{grid-column:2;grid-row:1;border-radius:9px 9px 3px 3px}.down{grid-column:2;grid-row:3;border-radius:3px 3px 9px 9px}.left{grid-column:1;grid-row:2;border-radius:9px 3px 3px 9px}.right{grid-column:3;grid-row:2;border-radius:3px 9px 9px 3px}.center{grid-column:2;grid-row:2;background:#263b4d;display:grid;place-items:center;font-size:12px}
    .buttons{display:flex;gap:8px;margin-top:11px}.action{flex:1;border:0;border-radius:10px;padding:9px 5px;font-size:11px;font-weight:800;cursor:pointer;color:#162637;background:var(--yellow)}.action:last-child{background:#d9e8ef}.hint{text-align:center;margin-top:9px;color:#9db2c1;font-size:10px}

    @media(max-width:700px){
      #title{top:7px;padding:5px 10px;border-radius:12px}#title strong{font-size:13px}#title span{font-size:8px}
      #remote{width:250px;right:9px;bottom:9px;padding:10px}.dpad{width:82px;height:82px}.ctrl{font-size:17px}.hint{display:none}.remote-head{padding-bottom:5px}
      #hud{left:8px;top:58px;grid-template-columns:1fr;gap:4px}.meter{padding:5px 8px}.meter small{display:inline;margin-right:5px}.meter strong{font-size:14px}
      #mission{top:55px;font-size:10px;max-width:42%;padding:6px 8px}#reset{right:8px;top:8px;padding:8px;font-size:11px}
      #helicopter{transform:scale(.82)}
    }
  </style>
</head>
<body>
<div id="game">
  <div id="world">
    <div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
    <div class="mountain m1"></div><div class="mountain m2"></div><div class="mountain m3"></div>
    <div class="city" id="city"></div>
    <div id="ground"><div class="road"></div></div>
    <div class="pad p1"></div><div class="pad p2"></div>
    <div class="tower t1 obstacle"></div><div class="tower t2 obstacle"></div><div class="pole obstacle"></div>
    <div id="helicopter" aria-label="helicopter">
      <div class="rotor"></div><div class="mast"></div><div class="tail"></div><div class="tail-fin"></div><div class="tail-rotor"></div>
      <div class="heli-body"><div class="window"></div></div><div class="skid"></div>
    </div>
  </div>

  <div id="title"><strong>RC HELICOPTER</strong><span>Designed by Prakash Kumar</span></div>

  <div id="hud">
    <div class="meter"><small>Altitude</small><strong id="altitude">0 m</strong></div>
    <div class="meter"><small>Speed</small><strong id="speed">0 km/h</strong></div>
    <div class="meter"><small>Score</small><strong id="score">0</strong></div>
  </div>

  <div id="mission">Take off and land on the pad at the right</div>
  <button id="reset">↻ Reset</button>
  <div id="message"></div>

  <div id="remote">
    <div class="remote-head"><strong>RC HELI CONTROL</strong><span class="led"></span></div>
    <div class="remote-grid">
      <div class="stick-box"><small>Altitude</small><div class="dpad">
        <button class="ctrl up" data-key="ArrowUp">▲</button><div class="center">LIFT</div><button class="ctrl down" data-key="ArrowDown">▼</button>
      </div></div>
      <div class="stick-box"><small>Direction</small><div class="dpad">
        <button class="ctrl left" data-key="ArrowLeft">◀</button><div class="center">MOVE</div><button class="ctrl right" data-key="ArrowRight">▶</button>
      </div></div>
    </div>
    <div class="buttons"><button class="action" id="takeoff">AUTO TAKEOFF</button><button class="action" id="land">AUTO LAND</button></div>
    <div class="hint">Touch controls • Keyboard: Arrow keys / W A S D • Space: land</div>
  </div>
</div>

<script>
(() => {
  const game=document.getElementById('game');
  const heli=document.getElementById('helicopter');
  const msg=document.getElementById('message');
  const keys=new Set();
  const state={x:70,y:0,vx:0,vy:0,angle:0,crashed:false,score:0,landed:true,target:null,last:performance.now()};

  const city=document.getElementById('city');
  [45,70,52,92,62,110,76,55,96,68,120,64,83,48].forEach(h=>{
    const b=document.createElement('div'); b.className='building'; b.style.height=h+'%'; city.appendChild(b);
  });

  function bounds(){return{w:game.clientWidth,h:game.clientHeight,ground:game.clientHeight*.74}}

  function reset(){
    const b=bounds();
    state.x=Math.max(28,b.w*.08); state.y=b.ground-76; state.vx=0; state.vy=0; state.angle=0;
    state.crashed=false; state.landed=true; state.target=null;
    heli.classList.remove('crashed'); hideMessage(); update();
  }

  function showMessage(text,ms=1700){
    msg.textContent=text; msg.classList.add('show'); clearTimeout(showMessage.t);
    showMessage.t=setTimeout(hideMessage,ms);
  }
  function hideMessage(){msg.classList.remove('show')}

  function rectsOverlap(a,b,pad=7){
    return a.left+pad<b.right && a.right-pad>b.left && a.top+pad<b.bottom && a.bottom-pad>b.top;
  }

  function crash(){
    if(state.crashed)return;
    state.crashed=true; state.target=null; state.vx=0; state.vy=2;
    heli.classList.add('crashed'); showMessage('CRASH! Press Reset',4000);
  }

  function update(){
    const b=bounds();
    state.x=Math.max(0,Math.min(b.w-145,state.x));
    state.y=Math.max(18,Math.min(b.ground-76,state.y));
    heli.style.left=state.x+'px'; heli.style.top=state.y+'px';
    heli.style.transform=`rotate(${state.angle}deg)`;
    document.getElementById('altitude').textContent=Math.max(0,Math.round((b.ground-76-state.y)*.18))+' m';
    document.getElementById('speed').textContent=Math.round(Math.hypot(state.vx,state.vy)*11)+' km/h';
    document.getElementById('score').textContent=state.score;
  }

  function loop(now){
    const dt=Math.min(2,(now-state.last)/16.67); state.last=now; const b=bounds();

    if(!state.crashed){
      const up=keys.has('ArrowUp')||keys.has('KeyW');
      const down=keys.has('ArrowDown')||keys.has('KeyS');
      const left=keys.has('ArrowLeft')||keys.has('KeyA');
      const right=keys.has('ArrowRight')||keys.has('KeyD');

      if(up||down||left||right){state.target=null;state.landed=false}
      if(up)state.vy-=.22*dt;
      if(down)state.vy+=.19*dt;
      if(left)state.vx-=.18*dt;
      if(right)state.vx+=.18*dt;
      if(!up&&!down&&!state.landed)state.vy+=.035*dt;

      state.vx*=Math.pow(.975,dt); state.vy*=Math.pow(.978,dt);
      state.vx=Math.max(-5,Math.min(5,state.vx)); state.vy=Math.max(-4,Math.min(4,state.vy));

      if(state.target){
        const dx=state.target.x-state.x,dy=state.target.y-state.y;
        state.vx+=Math.sign(dx)*Math.min(.11,Math.abs(dx)*.0015)*dt;
        state.vy+=Math.sign(dy)*Math.min(.11,Math.abs(dy)*.0015)*dt;
        if(Math.abs(dx)<5&&Math.abs(dy)<5){
          state.x=state.target.x;state.y=state.target.y;state.vx=state.vy=0;
          state.landed=state.target.land;state.target=null;
          if(state.landed){state.score+=100;showMessage('Perfect landing! +100')}
          else showMessage('Takeoff complete');
        }
      }

      state.x+=state.vx*dt; state.y+=state.vy*dt; state.angle=state.angle*.82+state.vx*2.25;
      if(state.y<=18){state.y=18;state.vy=Math.max(0,state.vy)}
      if(state.x<=0||state.x>=b.w-145){state.vx*=-.35;state.x=Math.max(0,Math.min(b.w-145,state.x))}

      const floor=b.ground-76;
      if(state.y>=floor){
        state.y=floor;
        const rightPad=state.x>b.w*.83-80, leftPad=state.x<b.w*.18;
        if(Math.abs(state.vy)<2.2&&Math.abs(state.vx)<2.3&&(rightPad||leftPad)){
          if(!state.landed&&rightPad){state.score+=100;showMessage('Mission complete! +100')}
          state.vx*=.55;state.vy=0;state.angle*=.6;state.landed=true;
        }else if(Math.abs(state.vy)>2.2||Math.abs(state.vx)>2.3)crash();
        else{state.vy=0;state.vx*=.7;state.landed=true}
      }

      if(!state.landed){
        const hr=heli.getBoundingClientRect();
        document.querySelectorAll('.obstacle').forEach(o=>{
          if(rectsOverlap(hr,o.getBoundingClientRect(),12))crash();
        });
      }
    }else{
      state.y=Math.min(b.ground-76,state.y+state.vy*dt); state.angle+=2.5*dt;
    }

    update(); requestAnimationFrame(loop);
  }

  function press(code,on){
    if(on)keys.add(code); else keys.delete(code);
    document.querySelectorAll(`[data-key="${code}"]`).forEach(x=>x.classList.toggle('active',on));
  }

  addEventListener('keydown',e=>{
    const allowed=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyW','KeyA','KeyS','KeyD'];
    if(allowed.includes(e.code)){
      e.preventDefault();
      if(e.code==='Space')autoLand(); else press(e.code,true);
    }
  });
  addEventListener('keyup',e=>press(e.code,false));

  document.querySelectorAll('.ctrl').forEach(btn=>{
    const code=btn.dataset.key;
    const on=e=>{e.preventDefault();try{btn.setPointerCapture(e.pointerId)}catch(_){}press(code,true)};
    const off=e=>{e.preventDefault();press(code,false)};
    btn.addEventListener('pointerdown',on);btn.addEventListener('pointerup',off);
    btn.addEventListener('pointercancel',off);btn.addEventListener('pointerleave',off);
  });

  function autoTakeoff(){
    if(state.crashed)return;
    state.landed=false;
    state.target={x:state.x,y:Math.max(65,bounds().ground-250),land:false};
  }

  function autoLand(){
    if(state.crashed)return;
    const b=bounds();
    state.landed=false;
    state.target={x:b.w-150,y:b.ground-76,land:true};
  }

  document.getElementById('takeoff').onclick=autoTakeoff;
  document.getElementById('land').onclick=autoLand;
  document.getElementById('reset').onclick=reset;

  addEventListener('resize',()=>{
    const b=bounds();
    state.x=Math.min(state.x,b.w-145); state.y=Math.min(state.y,b.ground-76); update();
  });

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
